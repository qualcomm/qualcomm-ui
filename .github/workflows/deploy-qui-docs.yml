name: Deploy QUI Docs

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      PROD_QUI_DOCS_AWS_ECR_ACCESS_KEY:
        required: true
      PROD_QUI_DOCS_AWS_ECR_SECRET_ACCESS_KEY:
        required: true
      PROD_QUI_DOCS_ECR_REGISTRY_URL:
        required: true

jobs:
  deploy:
    uses: ./.github/workflows/reusable-docs-deploy-prod.yml
    with:
      dockerfile: dockerfiles/dockerfile-qui-docs
      ecr-repository-name: qui-docs
    secrets:
      PROD_QUI_DOCS_AWS_ECR_ACCESS_KEY: ${{ secrets.PROD_QUI_DOCS_AWS_ECR_ACCESS_KEY }}
      PROD_QUI_DOCS_AWS_ECR_SECRET_ACCESS_KEY: ${{ secrets.PROD_QUI_DOCS_AWS_ECR_SECRET_ACCESS_KEY }}
      PROD_QUI_DOCS_ECR_REGISTRY_URL: ${{ secrets.PROD_QUI_DOCS_ECR_REGISTRY_URL }}
